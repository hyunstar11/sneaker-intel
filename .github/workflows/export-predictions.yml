name: Export Model Predictions

on:
  schedule:
    - cron: "0 5 1 * *"   # 1st of every month at 5am UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Train ensemble and export predictions
        run: >
          uv run python scripts/export_model_predictions.py
          --out data/processed/model_predictions.json

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/model_predictions.json
          git diff --staged --quiet || git commit -m "chore: refresh model predictions $(date -u +%Y-%m-%d)"
          git push
